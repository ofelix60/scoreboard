apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreboard-deployment
  labels:
    app: scoreboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scoreboard
  template:
    metadata:
      labels:
        app: scoreboard
      annotations:
        # Hash of the SOURCE manifest (configmap.yaml), not the live object.
        # The live object carries uid/resourceVersion/creationTimestamp/managedFields,
        # which change on their own — hashing those fires on non-changes and misses real ones.
        checksum/config: "753d909f2a482d8b503a452d08554442480ae712c4e024db99eb022ab970a270"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - image: ghcr.io/ofelix60/scoreboard@sha256:2cf2798b8b30bcb7a5c6b33bcca50f1b842ac24af89f8e78316f42cc0f92fdb9
          name: scoreboard
          ports:
          - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: scoreboard-configmap
            - secretRef:
                name: scoreboard-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          volumeMounts:
            - name: config-volume
              mountPath: /etc/scoreboard
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: scoreboard-configmap
      serviceAccountName: scoreboard