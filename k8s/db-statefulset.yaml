apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sb-db
  labels:
    app: sb-db
spec:
  serviceName: sb-db
  replicas: 1
  selector:
    matchLabels:
      app: sb-db
  template:
    metadata:
      labels:
        app: sb-db
    spec:
      containers:
        - name: postgres
          image: postgres@sha256:f9d1e581cde3e4c8bc696b07e6f7b7aea1d41014b33a52b27990762daae61beb
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "scoreboard"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scoreboard-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: sb-db-initdb
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi