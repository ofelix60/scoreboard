apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scoreboard
spec:
  ingressClassName: nginx
  rules:
  - host: scoreboard.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: scoreboard
            port:
              number: 80